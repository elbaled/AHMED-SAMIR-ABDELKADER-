<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Dashboard | Ahmed Samir</title>

    <link rel="stylesheet" href="dashboard.css">

    <style>
        /* ===============================
           MODAL FIX
           =============================== */

        #modal {
            position: fixed;
            inset: 0;
            z-index: 99999;

            display: none;

            place-items: center;

            padding: 20px;

            background: rgba(0, 0, 0, 0.75);
        }

        #modal.show {
            display: grid !important;
        }

        #modal[hidden] {
            display: none !important;
        }

        .modalbox {
            position: relative;

            width: min(600px, 100%);
            max-height: 90vh;

            overflow-y: auto;

            background: #0f1d30;
            color: #ffffff;

            border: 1px solid #294058;
            border-radius: 16px;

            padding: 24px;

            box-shadow: 0 20px 60px rgba(0,0,0,.5);
        }

        #close {
            position: absolute;
            top: 10px;
            right: 10px;

            width: 36px;
            height: 36px;

            border: 0;
            border-radius: 8px;

            background: #18283b;
            color: #ffffff;

            font-size: 22px;

            cursor: pointer;
        }

        #close:hover {
            background: #20c997;
            color: #06150f;
        }
    </style>
</head>

<body>

<header>

    <a href="index.html">
        ← Portfolio
    </a>

    <b>
        Ahmed Samir Dashboard
    </b>

    <button id="logout">
        Sign out
    </button>

</header>


<main>

    <!-- ACCESS CHECK -->

    <div id="guard">
        Checking access...
    </div>


    <!-- DASHBOARD -->

    <section id="dash" hidden>

        <!-- TABS -->

        <div class="tabs">

            <button data-tab="projects">
                Projects
            </button>

            <button data-tab="certificates">
                Certificates
            </button>

            <button data-tab="skills">
                Skills
            </button>

            <button data-tab="profile">
                Profile
            </button>

        </div>


        <!-- PROJECTS -->

        <div id="projects" class="panel">

            <h2>
                Projects

                <button id="addProject">
                    + Add
                </button>
            </h2>

            <div id="projectsList">
            </div>

        </div>


        <!-- CERTIFICATES -->

        <div id="certificates" class="panel" hidden>

            <h2>
                Certificates

                <button id="addCert">
                    + Add
                </button>
            </h2>

            <div id="certList">
            </div>

        </div>


        <!-- SKILLS -->

        <div id="skills" class="panel" hidden>

            <h2>
                Skills

                <button id="addSkill">
                    + Add
                </button>
            </h2>

            <div id="skillList">
            </div>

        </div>


        <!-- PROFILE -->

        <div id="profile" class="panel" hidden>

            <h2>
                Profile
            </h2>

            <form id="profileForm">
            </form>

        </div>

    </section>

</main>


<!-- ===============================
     MODAL
     =============================== -->

<div
    id="modal"
    hidden
    aria-hidden="true"
>

    <div
        class="modalbox"
        role="dialog"
        aria-modal="true"
        aria-labelledby="mt"
    >

        <button
            id="close"
            type="button"
            aria-label="Close"
        >
            ×
        </button>

        <h2 id="mt">
        </h2>

        <form id="editor">
        </form>

    </div>

</div>


<!-- FIREBASE / DASHBOARD JS -->

<script
    type="module"
    src="dashboard.js"
></script>


<!-- EXTRA MODAL CONTROL -->

<script>
document.addEventListener("DOMContentLoaded", function () {

    const modal = document.getElementById("modal");
    const close = document.getElementById("close");

    /*
     * Make sure the modal starts completely hidden.
     */
    if (modal) {
        modal.hidden = true;
        modal.classList.remove("show");
        modal.style.display = "none";
        modal.setAttribute("aria-hidden", "true");
    }

    /*
     * Close button
     */
    if (close) {

        close.addEventListener("click", function () {

            modal.hidden = true;
            modal.classList.remove("show");
            modal.style.display = "none";

            modal.setAttribute("aria-hidden", "true");

        });

    }

    /*
     * Close when clicking outside the modal box
     */
    if (modal) {

        modal.addEventListener("click", function (event) {

            if (event.target === modal) {

                modal.hidden = true;
                modal.classList.remove("show");
                modal.style.display = "none";

                modal.setAttribute("aria-hidden", "true");

            }

        });

    }

    /*
     * Close with ESC
     */
    document.addEventListener("keydown", function (event) {

        if (event.key === "Escape" && modal) {

            modal.hidden = true;
            modal.classList.remove("show");
            modal.style.display = "none";

            modal.setAttribute("aria-hidden", "true");

        }

    });

});
</script>

</body>
</html>
